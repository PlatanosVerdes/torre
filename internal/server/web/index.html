<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Torre</title>
<meta name="theme-color" content="#0f1720" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Torre">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --ink: #111827; --muted: #6b7280; --line: #e5e7eb;
  --accent: #2563eb; --ok: #15803d; --warn: #c2410c; --bad: #b91c1c; --soft: #eef2f7;
  --board: #111827; --board-ink: #f9fafb;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1720; --card: #17212c; --ink: #e5e7eb; --muted: #94a3b8; --line: #243243;
    --accent: #60a5fa; --ok: #4ade80; --warn: #fb923c; --bad: #f87171; --soft: #1d2a37;
    --board: #0b1118; --board-ink: #f9fafb;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding-bottom: env(safe-area-inset-bottom); overflow-x: hidden;
}
header {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding: calc(env(safe-area-inset-top) + 10px) 16px 8px; border-bottom: 1px solid var(--line);
}
.row { display: flex; gap: 8px; align-items: center; }
h1 { font-size: 20px; margin: 0; letter-spacing: -0.02em; }
h1 span { color: var(--muted); font-weight: 500; }
.airport {
  flex: 1; min-width: 0; width: 100%; font: inherit; font-weight: 600; color: var(--ink); background: var(--card);
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px;
}
.seg { display: flex; background: var(--soft); border-radius: 10px; padding: 3px; margin-top: 8px; }
.seg button {
  flex: 1; border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 600;
  padding: 7px; border-radius: 8px;
}
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
input[type=search] {
  width: 100%; margin-top: 8px; font: inherit; font-size: 16px; color: var(--ink); background: var(--card);
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
}
.chips { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit;
  font-size: 13px; padding: 5px 10px; border-radius: 999px; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.meta { color: var(--muted); font-size: 12px; padding: 8px 16px 0; display: flex; justify-content: space-between; }
main { padding: 4px 16px 24px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; }
.list { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.f {
  display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 2px 10px; padding: 10px 12px;
  border-top: 1px solid var(--line); cursor: pointer; width: 100%; text-align: left;
  background: none; border-left: 0; border-right: 0; border-bottom: 0; color: inherit; font: inherit;
}
.f:first-child { border-top: 0; }
.f.done { opacity: .55; }
.t { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 16px; }
.t s { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.t.late { color: var(--warn); }
.iata { color: var(--muted); font-weight: 700; margin-right: 4px; font-variant-numeric: tabular-nums; }
.dest { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub { color: var(--muted); font-size: 13px; grid-column: 2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side { grid-row: 1 / span 2; grid-column: 3; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.badge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.badge.ok { color: var(--ok); } .badge.warn { color: var(--warn); } .badge.bad { color: var(--bad); }
.badge.go { background: var(--accent); color: #fff; }
.gate { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.gate b { color: var(--ink); font-size: 14px; }
.empty, .error { padding: 24px 12px; text-align: center; color: var(--muted); }
.error { color: var(--bad); }
.more { display: block; width: 100%; margin-top: 10px; padding: 11px; border-radius: 10px; border: 1px dashed var(--line); background: none; color: var(--accent); font: inherit; font-weight: 600; }
.track-card .f { cursor: pointer; }
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 10; display: none; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; background: var(--card); color: var(--ink);
  border-radius: 16px 16px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
  transform: translateY(100%); transition: transform .2s ease; max-width: 640px; margin: 0 auto;
  max-height: 92vh; overflow-y: auto;
}
.open .sheet-bg { display: block; } .open .sheet { transform: none; }
.board {
  background: var(--board); color: var(--board-ink); border-radius: 12px; padding: 14px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  font-variant-numeric: tabular-nums;
}
.board div small { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .6; }
.board div b { font-size: 22px; font-family: ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .02em; }
.board .wide { grid-column: 1 / -1; }
.sheet h3 { margin: 0 0 2px; font-size: 22px; }
.sheet p { margin: 0 0 12px; color: var(--muted); }
.btn { display: block; width: 100%; margin-top: 12px; padding: 13px; border: 0; border-radius: 12px; font: inherit; font-weight: 700; background: var(--accent); color: #fff; }
.btn.secondary { background: var(--soft); color: var(--ink); }
.note { font-size: 12px; color: var(--muted); margin-top: 8px; text-align: center; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 14px; z-index: 20; display: none; }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>Torre</h1>
    <select class="airport" id="airport" aria-label="Aeropuerto"></select>
  </div>
  <div class="seg" role="group" aria-label="Tipo">
    <button id="dirS" aria-pressed="true">Salidas</button>
    <button id="dirL" aria-pressed="false">Llegadas</button>
  </div>
  <input type="search" id="q" placeholder="Vuelo, destino o compañía (FR2495, Palma, Ryanair)" autocomplete="off" enterkeyhint="search">
  <div class="chips" id="chips"></div>
</header>
<div class="meta"><span id="updated"></span><span id="count"></span></div>
<main>
  <section id="trackedWrap" hidden>
    <h2>Siguiendo</h2>
    <div class="list track-card" id="tracked"></div>
  </section>
  <h2 id="boardTitle">Vuelos</h2>
  <div class="list" id="list"><div class="empty">Cargando…</div></div>
  <button class="more" id="more" hidden>Ver más días</button>
</main>

<div id="sheetRoot">
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const params = new URLSearchParams(location.search);
const iata = (s) => /^[A-Z]{3}$/.test(s || '') ? s : null;
const state = {
  airport: iata((params.get('a') || '').toUpperCase()) || iata(store.get('airport', '')) || 'BCN',
  dir: (params.get('d') || store.get('dir', 'S')).toUpperCase() === 'L' ? 'L' : 'S',
  q: params.get('q') || '',
  day: null,
  showDone: false,
  full: false,
  flights: [],
  updated: 0,
  tracked: [],
  notify: false,
};
$('q').value = state.q;
$('dirS').setAttribute('aria-pressed', state.dir === 'S');
$('dirL').setAttribute('aria-pressed', state.dir === 'L');

const GO = new Set(['EMB', 'ULL']);
const BAD = new Set(['CAN', 'DES', 'DIV']);
const WARN = new Set(['RET', 'NPR', 'NPT', 'CER']);
const OK = new Set(['INI', 'HOR', 'LND', 'IBK', 'FLY', 'FNL']);

function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function norm(s) { return String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
const SMALL = new Set(['de', 'del', 'la', 'las', 'los', 'y']);
function title(s) {
  return String(s ?? '').toLowerCase().replace(/(^|[\s/(-])(\p{L}+)/gu, (m, a, w) => a + (a && SMALL.has(w) ? w : w[0].toUpperCase() + w.slice(1)));
}

function todayStr(offset = 0) {
  const d = new Date(Date.now() + offset * 864e5);
  return d.toLocaleDateString('es-ES', { timeZone: 'Europe/Madrid', day: '2-digit', month: '2-digit', year: 'numeric' });
}
function dayLabel(date) {
  if (date === todayStr()) return 'Hoy';
  if (date === todayStr(1)) return 'Mañana';
  if (date === todayStr(-1)) return 'Ayer';
  const [d, m, y] = date.split('/');
  return new Date(+y, m - 1, +d).toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
}
function badgeClass(f) {
  if (GO.has(f.status)) return 'go';
  if (BAD.has(f.status)) return 'bad';
  if (WARN.has(f.status) || f.delayMin >= 15 || (f.status === 'BOR' && !f.final)) return 'warn';
  if (OK.has(f.status)) return 'ok';
  return '';
}
function statusText(f) {
  if (f.status === 'RET' && f.delayMin > 0) return `Retrasado ${fmtDelay(f.delayMin)}`;
  return f.statusLabel;
}
function fmtDelay(m) {
  const sign = m < 0 ? '-' : '+';
  m = Math.abs(m);
  return m >= 60 ? `${sign}${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}` : `${sign}${m} min`;
}
function place(f) { return title(f.otherCity || f.other) + (f.other ? ` (${f.other})` : ''); }

async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = res.status === 204 ? null : await res.json().catch(() => null);
  if (!res.ok) throw new Error(body?.error || `Error ${res.status}`);
  return body;
}

async function loadAirports() {
  const sel = $('airport');
  sel.innerHTML = `<option value="${esc(state.airport)}">${esc(state.airport)}</option>`;
  try {
    const list = await api('api/airports');
    sel.innerHTML = list.map(a => `<option value="${a.iata}">${a.iata} · ${esc(a.name)}</option>`).join('');
    sel.value = state.airport;
  } catch {}
}

let loading = 0;
async function loadBoard() {
  const my = ++loading;
  const url = `api/board?airport=${state.airport}&dir=${state.dir}${state.full ? '&range=full' : ''}`;
  try {
    const data = await api(url);
    if (my !== loading) return;
    state.flights = data.flights;
    state.updated = data.updated;
    render();
    const wanted = params.get('f');
    if (wanted) {
      params.delete('f');
      const f = state.flights.find(f => f.id === wanted || f.number === wanted.toUpperCase());
      if (f) openSheet(f);
    }
  } catch (e) {
    if (my !== loading) return;
    $('list').innerHTML = `<div class="error">No se pudo leer AENA: ${esc(e.message)}</div>`;
  }
}

async function loadTracked() {
  try {
    const data = await api('api/tracked');
    state.tracked = data.tracked || [];
    state.notify = data.notify;
    renderTracked();
  } catch {}
}

function filtered() {
  const q = norm(state.q).replace(/\s+/g, '');
  const words = norm(state.q).split(/\s+/).filter(Boolean);
  return state.flights.filter(f => {
    if (state.day && f.date !== state.day) return false;
    if (!state.showDone && !q && f.final) return false;
    if (!words.length) return true;
    const hay = norm([f.number, ...(f.codeshare || []), f.airline, f.otherCity, f.other].join(' '));
    const compact = hay.replace(/\s+/g, '');
    return compact.includes(q) || words.every(w => hay.includes(w));
  });
}

function row(f, opts = {}) {
  const late = f.delayMin >= 15;
  const time = f.estimated
    ? `<div class="t ${late ? 'late' : ''}">${esc(f.estimated)}<s>${esc(f.scheduled)}</s></div>`
    : `<div class="t">${esc(f.scheduled)}</div>`;
  const where = f.direction === 'L' && f.belt ? `Cinta <b>${esc(f.belt)}</b>` : f.gate ? `Puerta <b>${esc(f.gate)}</b>` : f.terminal ? `<b>${esc(f.terminal)}</b>` : '';
  const codes = (f.codeshare || []).length ? ` · ${f.codeshare.length > 2 ? '+' + f.codeshare.length : f.codeshare.join(', ')}` : '';
  const prefix = opts.withRoute ? `${esc(f.airport)} ${f.direction === 'L' ? '←' : '→'} ` : '';
  return `<button class="f ${f.final ? 'done' : ''}" data-id="${esc(opts.trackId || f.id)}" data-kind="${opts.trackId ? 'tracked' : 'flight'}">
    ${time}
    <div class="dest">${prefix}<span class="iata">${esc(f.other)}</span>${esc(title(f.otherCity || f.other))}</div>
    <div class="side"><span class="badge ${badgeClass(f)}">${esc(f.statusLabel)}</span><span class="gate">${where}</span></div>
    <div class="sub">${esc(f.number)} · ${esc(f.airline)}${esc(codes)}${opts.withRoute ? ' · ' + esc(dayLabel(f.date)) : ''}</div>
  </button>`;
}

function renderChips() {
  const days = [...new Set(state.flights.map(f => f.date))];
  if (state.day && !days.includes(state.day)) state.day = null;
  if (!state.day) state.day = days.includes(todayStr()) ? todayStr() : days[0] || null;
  const chips = days.map(d => `<button class="chip" data-day="${d}" aria-pressed="${d === state.day}">${esc(dayLabel(d))}</button>`);
  chips.push(`<button class="chip" data-done="1" aria-pressed="${state.showDone}">Mostrar finalizados</button>`);
  $('chips').innerHTML = chips.join('');
}

function render() {
  renderChips();
  const list = filtered();
  renderUpdated();
  $('count').textContent = `${list.length} vuelos`;
  $('boardTitle').textContent = `${state.dir === 'S' ? 'Salidas' : 'Llegadas'} · ${state.airport}`;
  $('list').innerHTML = list.length
    ? list.slice(0, 400).map(f => row(f)).join('')
    : `<div class="empty">${state.q ? 'Ningún vuelo coincide' : 'No hay vuelos'}${state.full ? '' : '. Prueba “Ver más días”.'}</div>`;
  $('more').hidden = state.full;
  $('dirS').setAttribute('aria-pressed', state.dir === 'S');
  $('dirL').setAttribute('aria-pressed', state.dir === 'L');
}

function renderUpdated() {
  const ago = state.updated ? Math.max(0, Math.round((Date.now() / 1000 - state.updated) / 60)) : null;
  $('updated').textContent = ago === null ? '' : ago < 1 ? 'Actualizado ahora' : `Actualizado hace ${ago} min`;
}

function renderTracked() {
  $('trackedWrap').hidden = !state.tracked.length;
  $('tracked').innerHTML = state.tracked.filter(t => t.last).map(t => row(t.last, { withRoute: true, trackId: t.id })).join('');
}

function openSheet(f, trackId) {
  const isTracked = trackId || state.tracked.some(t => t.last && t.last.id === f.id && t.airport === f.airport);
  const arr = f.direction === 'L';
  const cells = [
    [arr ? 'Llegada prevista' : 'Salida prevista', f.estimated || f.scheduled],
    ['Retraso', f.delayMin > 0 ? fmtDelay(f.delayMin) : '—'],
    ['Terminal', f.terminal || '—'],
    [arr ? 'Cinta' : 'Puerta', (arr ? f.belt : f.gate) || '—'],
  ];
  if (!arr) cells.push(['Mostradores', f.counters || '—']);
  cells.push(['Programado', f.scheduled + (f.estimatedDate ? ` · llega el ${f.estimatedDate.slice(0, 5)}` : '')]);
  const route = arr ? `${place(f)} → ${f.airport}` : `${f.airport} → ${place(f)}`;
  const id = trackId || state.tracked.find(t => t.last && t.last.id === f.id)?.id;
  $('sheet').innerHTML = `
    <h3>${esc(f.number)} <span class="badge ${badgeClass(f)}">${esc(statusText(f))}</span></h3>
    <p>${esc(route)} · ${esc(f.airline)} · ${esc(dayLabel(f.date))}${f.aircraft ? ' · ' + esc(f.aircraft) : ''}
    ${(f.codeshare || []).length ? `<br>También como ${esc(f.codeshare.join(', '))}` : ''}</p>
    <div class="board">${cells.map((c, i) => `<div class="${i === cells.length - 1 && cells.length % 2 ? 'wide' : ''}"><small>${esc(c[0])}</small><b>${esc(c[1])}</b></div>`).join('')}</div>
    ${isTracked
      ? `<button class="btn secondary" id="untrack" data-id="${esc(id)}">Dejar de seguir</button>`
      : `<button class="btn" id="track">${state.notify ? 'Seguir y avisarme por Telegram' : 'Seguir este vuelo'}</button>`}
    ${!isTracked && state.notify ? '<div class="note">Te aviso de cambios de hora, puerta y estado hasta que despegue o aterrice.</div>' : ''}
    <button class="btn secondary" id="close">Cerrar</button>`;
  $('sheetRoot').classList.add('open');
  $('close').onclick = closeSheet;
  if ($('track')) $('track').onclick = async (e) => {
    e.target.disabled = true;
    try {
      await api('api/tracked', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ airport: f.airport, direction: f.direction, date: f.date, number: f.number }) });
      toast(state.notify ? 'Siguiendo. Te llega un mensaje a Telegram.' : 'Siguiendo');
      closeSheet(); loadTracked();
    } catch (err) { toast(err.message); e.target.disabled = false; }
  };
  if ($('untrack')) $('untrack').onclick = async (e) => {
    try { await api('api/tracked/' + encodeURIComponent(e.target.dataset.id), { method: 'DELETE' }); toast('Ya no lo sigues'); closeSheet(); loadTracked(); }
    catch (err) { toast(err.message); }
  };
}
function closeSheet() { $('sheetRoot').classList.remove('open'); }
let toastTimer;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', 2600); }

function saveUrl() {
  store.set('airport', state.airport); store.set('dir', state.dir);
  const p = new URLSearchParams({ a: state.airport, d: state.dir });
  if (state.q) p.set('q', state.q);
  history.replaceState(null, '', '?' + p);
}

$('airport').onchange = (e) => { state.airport = e.target.value; state.day = null; state.full = false; saveUrl(); $('list').innerHTML = '<div class="empty">Cargando…</div>'; loadBoard(); };
$('dirS').onclick = () => { if (state.dir !== 'S') { state.dir = 'S'; state.full = false; saveUrl(); loadBoard(); } };
$('dirL').onclick = () => { if (state.dir !== 'L') { state.dir = 'L'; state.full = false; saveUrl(); loadBoard(); } };
let qTimer;
$('q').oninput = (e) => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = e.target.value; saveUrl(); render(); }, 120); };
$('chips').onclick = (e) => {
  const b = e.target.closest('.chip'); if (!b) return;
  if (b.dataset.done) state.showDone = !state.showDone; else state.day = b.dataset.day;
  render();
};
$('more').onclick = () => { state.full = true; $('more').hidden = true; toast('Cargando dos semanas, AENA tarda unos 15 segundos…'); loadBoard(); };
document.addEventListener('click', (e) => {
  const b = e.target.closest('.f'); if (!b) return;
  if (b.dataset.kind === 'tracked') {
    const t = state.tracked.find(t => t.id === b.dataset.id); if (t) openSheet(t.last, t.id);
  } else {
    const f = state.flights.find(f => f.id === b.dataset.id); if (f) openSheet(f);
  }
});
$('sheetBg').onclick = closeSheet;

function refresh() { if (document.visibilityState === 'visible') { loadBoard(); loadTracked(); } }
document.addEventListener('visibilitychange', refresh);
setInterval(refresh, 60000);
setInterval(renderUpdated, 30000);

saveUrl();
loadAirports();
loadBoard();
loadTracked();
</script>
</body>
</html>
